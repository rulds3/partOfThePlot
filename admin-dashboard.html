<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reservations | Part of the Plot</title>

	<link rel="icon" type="image/x-icon" href="favicon.ico">

    <link
        rel="stylesheet"
        href="style.css"
    >
	
	<link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


<main class="admin-dashboard">

    <div class="admin-container">


        <!-- =================================================
             HEADER
        ================================================= -->

		<header class="admin-header">

			<div>

				<p class="eyebrow">
					PART OF THE PLOT
				</p>

				<h1>
					Reservations
				</h1>

				<p>
					Manage your mystery party reservations.
				</p>

			</div>


			<div class="admin-header-actions">

				<a
					href="../../games/deadMansChest/admin-dead-mans-chest.html"
					class="button admin-tool-button"
				>
					Crew Results
				</a>

				<button
					id="open-public-event-form"
					class="button admin-tool-button"
					type="button"
				>
					Create Public Game
				</button>

				<button
					id="logout-button"
					class="button logout-button"
					type="button"
				>
					Log Out
				</button>

			</div>

		</header>


		<!-- =================================================
			 CREATE PUBLIC GAME MODAL
		================================================= -->

		<div
			id="public-event-modal"
			class="admin-modal"
			hidden
		>

			<div
				class="admin-modal-content"
				role="dialog"
				aria-modal="true"
				aria-labelledby="public-event-modal-title"
			>

				<div class="admin-modal-header">

					<div>

						<p class="eyebrow">
							TICKETED EVENTS
						</p>

						<h2 id="public-event-modal-title">
							Create Public Game
						</h2>

					</div>


					<button
						id="close-public-event-form"
						class="admin-modal-close"
						type="button"
						aria-label="Close"
					>
						&times;
					</button>

				</div>


				<form
					id="public-event-form"
					class="public-event-form"
				>

					<div class="form-field">
						<label for="public-event-game">Game</label>

						<select
							id="public-event-game"
							name="game"
							required
						>
							<option value="">
								Select a game
							</option>
						</select>

						<p
							id="public-event-capacity"
							class="form-help"
						></p>
					</div>


					<div class="form-field">

						<label for="public-event-date">
							Date
						</label>

						<input
							id="public-event-date"
							name="reservation_date"
							type="date"
							required
						>

					</div>


					<div class="form-field">

						<label for="public-event-time">
							Start Time
						</label>

						<input
							id="public-event-time"
							name="reservation_time"
							type="time"
							required
						>

					</div>


					<div class="form-field">
						<label for="public-event-location">
							Public Location
						</label>

						<input
							id="public-event-location"
							name="location"
							type="text"
							placeholder="Idaho Falls"
							required
						>
					</div>

					<div class="form-field form-field-full">
						<label>
							Venue Address
						</label>

						<div class="venue-address-fields">

							<input
								id="public-event-venue-street"
								name="venue_street"
								type="text"
								placeholder="Street address"
								autocomplete="street-address"
								required
							>

							<input
								id="public-event-venue-city"
								name="venue_city"
								type="text"
								placeholder="City"
								autocomplete="address-level2"
								required
							>

							<input
								id="public-event-venue-state"
								name="venue_state"
								type="text"
								placeholder="State"
								maxlength="2"
								autocomplete="address-level1"
								required
							>

							<input
								id="public-event-venue-zip"
								name="venue_zip"
								type="text"
								inputmode="numeric"
								placeholder="ZIP"
								autocomplete="postal-code"
								required
							>

						</div>
					</div>

					<div class="form-field">
						<label for="public-event-price">Price Per Person</label>
						<input
							id="public-event-price"
							name="ticket_price"
							type="number"
							min="0"
							step="0.01"
							placeholder="35.00"
							required
						>
					</div>
					
					<div class="form-field">

						<label for="public-event-deadline">
							Registration Deadline
						</label>

						<input
							id="public-event-deadline"
							name="registration_deadline"
							type="datetime-local"
						>

					</div>


					<div class="form-field form-field-full">

						<label for="public-event-description">
							Public Description
						</label>

						<textarea
							id="public-event-description"
							name="public_description"
							rows="4"
							placeholder="Tell players about this particular game..."
						></textarea>

					</div>


					<p
						id="public-event-form-message"
						class="admin-message"
						aria-live="polite"
					></p>


					<div class="form-actions">

						<button
							type="button"
							id="cancel-public-event-form"
							class="button admin-tool-button"
						>
							Cancel
						</button>


						<button
							type="submit"
							class="button"
						>
							Create Public Game
						</button>

					</div>

				</form>

			</div>

		</div>

        <!-- =================================================
             MESSAGE
        ================================================= -->

        <p
            id="admin-message"
            class="admin-message"
            aria-live="polite"
        >
            Loading reservations...
        </p>


        <!-- =================================================
             RESERVATION FILTERS
        ================================================= -->

        <div class="admin-dashboard-tools">

            <div
                class="reservation-filters"
                aria-label="Reservation filters"
            >

                <button
                    class="reservation-filter active"
                    type="button"
                    data-filter="all"
                >
                    All
                </button>


                <button
                    class="reservation-filter"
                    type="button"
                    data-filter="upcoming"
                >
                    Upcoming
                </button>


                <button
                    class="reservation-filter"
                    type="button"
                    data-filter="attention"
                >
                    Needs Attention
                </button>


                <button
                    class="reservation-filter"
                    type="button"
                    data-filter="past"
                >
                    Past
                </button>

            </div>

        </div>


        <!-- =================================================
             RESERVATION LIST
        ================================================= -->

        <div
            id="reservation-list"
            class="reservation-list"
        ></div>


    </div>

</main>

<script src="supabase.js"></script>

<script
    type="module"
    src="admin-dashboard.js"
></script>

</body>

</html>

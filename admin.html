<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Part of the Plot</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

	<link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


<main class="admin-page">

    <section class="admin-login">

        <p class="eyebrow">
            PART OF THE PLOT
        </p>

        <h1>
            Admin Login
        </h1>

        <p>
            Sign in to manage reservations.
        </p>


        <form id="admin-login-form">

            <label for="admin-email">
                Email Address
            </label>

            <input
                type="email"
                id="admin-email"
                required
                autocomplete="username"
            >


            <label for="admin-password">
                Password
            </label>

            <input
                type="password"
                id="admin-password"
                required
                autocomplete="current-password"
            >


            <button
                type="submit"
                class="button"
            >
                Sign In
            </button>


            <p
                id="admin-message"
                class="admin-message"
                aria-live="polite"
            ></p>

        </form>

    </section>

</main>

<script
    type="module"
    src="admin.js"
></script>

</body>

</html>

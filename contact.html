<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

	<title>Contact Part of the Plot | Idaho Falls Mystery Parties</title>

	<meta
		name="description"
		content="Contact Part of the Plot about immersive mystery parties in Idaho Falls and surrounding areas. Ask a question, inquire about a game, or start planning your event."
	>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- ================= NAVIGATION ================= -->

<div id="site-header"></div>


<!-- ================= CONTACT ================= -->

<section class="contact">

    <div class="contact-container">


        <!-- CONTACT INFORMATION -->

        <div class="contact-info">

            <h3>
                Part of the Plot
            </h3>

            <p>
                Immersive role-playing mystery parties
                designed to make you part of the story.
            </p>

            <p>
                Whether you're planning a party,
                curious about one of our games, or
                just have a question, send me a message.
            </p>

            <p>
                <strong>Email:</strong><br>
                your@email.com
            </p>

            <p>
                <strong>Call/Text:</strong><br>
                number here
            </p>

            <p>
				Based in Idaho Falls, Idaho
            </p>

        </div>



        <!-- CONTACT FORM -->

		<form
			id="contact-form"
			class="contact-form"
		>

			<!-- Spam protection -->
			<input
				type="text"
				name="_gotcha"
				tabindex="-1"
				autocomplete="off"
				aria-hidden="true"
				style="position:absolute; left:-9999px;"
			>

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                autocomplete="name"
                required
                aria-label="Your Name"
            >


            <input
                type="email"
                name="email"
                placeholder="Your Email"
                autocomplete="email"
                required
                aria-label="Your Email"
            >

            <textarea
                name="message"
                rows="6"
                aria-label="Your message"
            ></textarea>


            <button
                type="submit"
                class="button"
            >
                Send Message
            </button>


            <div
                class="form-message"
                id="contact-success"
                role="status"
                aria-live="polite"
            ></div>

        </form>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<div id="site-footer"></div>


<!-- ================= JAVASCRIPT ================= -->

<script src="script.js"></script>


</body>

</html>

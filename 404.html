<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Plot Not Found | Part of the Plot</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>

    :root {
        --dark: #10131a;
        --dark-blue: #171c28;
        --gold: #c6a15b;
        --light-gold: #e2c989;
        --cream: #eee9df;
    }


    /* =========================================
       404 PAGE
    ========================================= */

    .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;

        background:
            radial-gradient(
                circle at center,
                #202638 0%,
                var(--dark) 65%
            );

        color: var(--cream);
        padding: 40px 20px;
    }


    .error-content {
        max-width: 700px;
    }


    /* =========================================
       LOGO
    ========================================= */

    .error-logo {
        display: block;
        width: min(280px, 70vw);
        height: auto;
        margin: 0 auto 35px;
    }


    /* =========================================
       ERROR NUMBER
    ========================================= */

    .error-number {
        font-size: clamp(5rem, 15vw, 9rem);
        line-height: 0.9;
        margin: 0 0 20px;

        color: var(--light-gold);

        font-weight: 700;
        letter-spacing: 0.08em;

        text-shadow:
            0 0 25px rgba(226, 201, 137, 0.15);
    }


    /* =========================================
       HEADLINE
    ========================================= */

    .error-title {
        font-family: Georgia, "Times New Roman", serif;

        font-size: clamp(2rem, 5vw, 3.2rem);

        margin: 0 0 18px;

        color: var(--cream);
    }


    /* =========================================
       MESSAGE
    ========================================= */

    .error-message {
        max-width: 580px;
        margin: 0 auto 35px;

        font-size: 1.1rem;
        line-height: 1.7;

        color: rgba(238, 233, 223, 0.82);
    }


    .error-message strong {
        color: var(--light-gold);
    }


    /* =========================================
       BUTTON
    ========================================= */

    .error-button {
        display: inline-block;

        padding: 14px 30px;

        border: 1px solid var(--gold);
        border-radius: 4px;

        background: var(--gold);
        color: var(--dark);

        text-decoration: none;

        font-weight: 700;
        letter-spacing: 0.04em;

        transition:
            background 0.25s ease,
            color 0.25s ease,
            transform 0.25s ease;
    }


    .error-button:hover {
        background: var(--light-gold);
        color: var(--dark);

        transform: translateY(-2px);
    }


    /* =========================================
       MYSTERY LINE
    ========================================= */

    .error-clue {
        margin-top: 45px;

        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;

        color: rgba(226, 201, 137, 0.65);
    }

</style>

</head>

<body>

<main class="error-page">


<div class="error-content">

    <img
        src="partOfThePlotLogo.png"
        alt="Part of the Plot"
        class="error-logo"
    >

    <div class="error-number">
        404
    </div>

    <h1 class="error-title">
        The Plot Has Gone Missing.
    </h1>

    <p class="error-message">
        It appears you've stumbled onto a scene
        that isn't part of this story.
        <br><br>
        The page you're looking for may have been
        moved, removed, or simply <br><strong>vanished
        without a trace.</strong>
    </p>

    <a
        href="index.html"
        class="error-button"
    >
        Return to the Plot
    </a>

    <p class="error-clue">
        Every mystery has a way back.
    </p>

</div>
</main>

</body>

</html>
